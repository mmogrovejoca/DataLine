                  nodes = new vis.DataSet([{"color": "#ff8400", "fixed": {"x": false, "y": false}, "id": "A", "label": "A", "level": 0, "physics": false, "shape": "dot", "size": 10}, {"color": "#bdc3c7", "fixed": {"x": false, "y": false}, "id": "B", "label": "B", "level": 1, "physics": false, "shape": "dot", "size": 10}, {"color": "#bdc3c7", "fixed": {"x": false, "y": false}, "id": "C", "label": "C", "level": 2, "physics": false, "shape": "dot", "size": 10}, {"color": "#bdc3c7", "fixed": {"x": false, "y": false}, "id": "D", "label": "D", "level": 3, "physics": false, "shape": "dot", "size": 10}, {"color": "#bdc3c7", "fixed": {"x": false, "y": false}, "id": "E", "label": "E", "level": 4, "physics": false, "shape": "dot", "size": 10}, {"color": "#bdc3c7", "fixed": {"x": false, "y": false}, "id": "F", "label": "F", "level": 5, "physics": false, "shape": "dot", "size": 10}, {"color": "#bdc3c7", "fixed": {"x": false, "y": false}, "id": "G", "label": "G", "level": 6, "physics": false, "shape": "dot", "size": 10}, {"color": "#bdc3c7", "fixed": {"x": false, "y": false}, "id": "H", "label": "H", "level": 7, "physics": false, "shape": "dot", "size": 10}, {"color": "#bdc3c7", "fixed": {"x": false, "y": false}, "id": "I", "label": "I", "level": 8, "physics": false, "shape": "dot", "size": 10}, {"color": "#bdc3c7", "fixed": {"x": false, "y": false}, "id": "J", "label": "J", "level": 9, "physics": false, "shape": "dot", "size": 10}, {"color": "#2ecc71", "fixed": {"x": false, "y": false}, "id": "K", "label": "K", "level": 10, "physics": false, "shape": "dot", "size": 10}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "A", "to": "B", "width": 1}, {"arrows": "to", "from": "B", "to": "C", "width": 1}, {"arrows": "to", "from": "C", "to": "D", "width": 1}, {"arrows": "to", "from": "D", "to": "E", "width": 1}, {"arrows": "to", "from": "E", "to": "F", "width": 1}, {"arrows": "to", "from": "F", "to": "G", "width": 1}, {"arrows": "to", "from": "G", "to": "H", "width": 1}, {"arrows": "to", "from": "H", "to": "I", "width": 1}, {"arrows": "to", "from": "I", "to": "J", "width": 1}, {"arrows": "to", "from": "J", "to": "K", "width": 1}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;

                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"layout": {"hierarchical": {"enabled": true, "direction": "LR", "sortMethod": "directed", "nodeSpacing": 200, "levelSeparation": 200}}, "physics": {"hierarchicalRepulsion": {"nodeDistance": 200, "centralGravity": 0.0, "springLength": 200, "springConstant": 0.01, "damping": 0.09}, "solver": "hierarchicalRepulsion"}, "edges": {"smooth": {"type": "cubicBezier", "forceDirection": "horizontal", "roundness": 0.8}}};






                  network = new vis.Network(container, data, options);










                  return network;

              }

        <script type="text/javascript">
        function searchTable() {
            var input = document.getElementById("searchInput").value.toUpperCase();
            var tables = document.querySelectorAll("table");
            for (let table of tables) {
                let rows = table.getElementsByTagName("tr");
                for (let row of rows) {
                    let cell = row.getElementsByTagName("td")[0];
                    if (cell) {
                        let txtValue = cell.textContent || cell.innerText;
                        row.style.display = txtValue.toUpperCase().indexOf(input) > -1 ? "" : "none";
                    }
                }
            }
            highlightNode(input);
        }
        function highlightNode(nodeId) {
            if (typeof network !== 'undefined') {
                let found = false;
                for (let node in network.body.nodes) {
                    let nodeObj = network.body.nodes[node];
                    let label = nodeObj.options.label;
                    if (label && label.toUpperCase() === nodeId) {
                        found = true;
                        const originalColor = nodeObj.options.color;
                        const originalSize = nodeObj.options.size || 10;
                        // Asegúrate de que el nodo no esté oculto
                        nodeObj.hidden = false;
                        // Centra la vista en el nodo
                        network.focus(node, {
                            scale: 1.5,
                            animation: { duration: 1000, easingFunction: "easeInOutQuad" }
                        });
                        // Resalta el nodo
                        nodeObj.setOptions({
                            color: { background: '#ff0000', border: '#ff0000' },
                            size: 20
                        });
                        setTimeout(() => {
                            nodeObj.setOptions({
                                color: originalColor,
                                size: originalSize
                            });
                        }, 3000);
                        var visibleNodes = new Set([node]);
                        // Función para realizar DFS y encontrar nodos de tipo INPUT
                        function dfs(node, visited, level, levels) {
                            visited.add(node);
                            if (!levels[level]) {
                                levels[level] = new Set();
                            }
                            levels[level].add(node);
                            var connectedFrom = network.getConnectedNodes(node, 'from');
                            for (let connectedNode of connectedFrom) {
                                if (!visited.has(connectedNode)) {
                                    dfs(connectedNode, visited, level + 1, levels);
                                }
                            }
                        }
                        // Realizar DFS desde el nodo inicial
                        var levels = {};
                        dfs(node, visibleNodes, 0, levels);
                        var allNodes = network.body.data.nodes.get();
                        var updateArray = [];
                        for (let n of allNodes) {
                            updateArray.push({
                                id: n.id,
                                hidden: !visibleNodes.has(n.id)
                            });
                        }
                        network.body.data.nodes.update(updateArray);
                        // Mostrar tablas de consumo por nivel
                        var consumptionTablesHTML = "<h3>Tablas de Consumo por Nivel:</h3>";
                        for (let level in levels) {
                            consumptionTablesHTML += `<h4>Nivel ${level}:</h4><ul>`;
                            levels[level].forEach(node => {
                                consumptionTablesHTML += `<li>${network.body.nodes[node].options.label}</li>`;
                            });
                            consumptionTablesHTML += "</ul>";
                        }
                        document.getElementById("consumptionTables").innerHTML = consumptionTablesHTML;
                        break;
                    }
                }
                if (!found) {
                    alert("Tabla no encontrada en el grafo.");
                }
            }
        }
        function resetGraph() {
            if (typeof network !== 'undefined') {
                var allNodes = network.body.data.nodes.get();
                var updateArray = [];
                for (let n of allNodes) {
                    updateArray.push({
                        id: n.id,
                        hidden: false
                    });
                }
                network.body.data.nodes.update(updateArray);
                document.getElementById("consumptionTables").innerHTML = "";
            }
        }
        </script>
