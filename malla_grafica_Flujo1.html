<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Visualizador de Grafos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>
<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://unpkg.com/cytoscape-dagre@2.4.0/cytoscape-dagre.js"></script>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f9fafc;
    }
    #cy {
        width: 100%;
        height: 100vh;
        display: block;
    }
    .cy-node {
        text-valign: center;
        text-halign: center;
        font-size: 12px;
        color: #fff;
        text-outline-width: 2px;
        text-outline-color: #888;
    }
</style>
</head>
<body>
<div id="cy"></div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var graphData = {
    "nodes": [
        {
            "data": {
                "id": "A",
                "label": "A",
                "level": 0,
                "color": "#ff8400"
            }
        },
        {
            "data": {
                "id": "B",
                "label": "B",
                "level": 1,
                "color": "#bdc3c7"
            }
        },
        {
            "data": {
                "id": "C",
                "label": "C",
                "level": 2,
                "color": "#bdc3c7"
            }
        },
        {
            "data": {
                "id": "D",
                "label": "D",
                "level": 3,
                "color": "#bdc3c7"
            }
        },
        {
            "data": {
                "id": "E",
                "label": "E",
                "level": 4,
                "color": "#bdc3c7"
            }
        },
        {
            "data": {
                "id": "F",
                "label": "F",
                "level": 5,
                "color": "#bdc3c7"
            }
        },
        {
            "data": {
                "id": "G",
                "label": "G",
                "level": 6,
                "color": "#bdc3c7"
            }
        },
        {
            "data": {
                "id": "H",
                "label": "H",
                "level": 7,
                "color": "#bdc3c7"
            }
        },
        {
            "data": {
                "id": "I",
                "label": "I",
                "level": 8,
                "color": "#bdc3c7"
            }
        },
        {
            "data": {
                "id": "J",
                "label": "J",
                "level": 9,
                "color": "#bdc3c7"
            }
        },
        {
            "data": {
                "id": "K",
                "label": "K",
                "level": 10,
                "color": "#2ecc71"
            }
        }
    ],
    "edges": [
        {
            "data": {
                "source": "A",
                "target": "B"
            }
        },
        {
            "data": {
                "source": "B",
                "target": "C"
            }
        },
        {
            "data": {
                "source": "C",
                "target": "D"
            }
        },
        {
            "data": {
                "source": "D",
                "target": "E"
            }
        },
        {
            "data": {
                "source": "E",
                "target": "F"
            }
        },
        {
            "data": {
                "source": "F",
                "target": "G"
            }
        },
        {
            "data": {
                "source": "G",
                "target": "H"
            }
        },
        {
            "data": {
                "source": "H",
                "target": "I"
            }
        },
        {
            "data": {
                "source": "I",
                "target": "J"
            }
        },
        {
            "data": {
                "source": "J",
                "target": "K"
            }
        }
    ]
};

        var cy = cytoscape({
            container: document.getElementById('cy'),
            elements: graphData,
            style: [
                {
                    selector: 'node',
                    style: {
                        'background-color': 'data(color)',
                        'label': 'data(label)',
                        'width': '80px',
                        'height': '80px',
                        'shape': 'ellipse',
                        'color': '#ffffff',
                        'text-valign': 'center',
                        'text-halign': 'center',
                        'font-size': '12px',
                        'text-wrap': 'wrap',
                        'text-max-width': '70px'
                    }
                },
                {
                    selector: 'edge',
                    style: {
                        'width': 2,
                        'line-color': '#ccc',
                        'target-arrow-color': '#ccc',
                        'target-arrow-shape': 'triangle',
                        'curve-style': 'unbundled-bezier',
                        'control-point-distances': '20 -20',
                        'control-point-weights': '0.25 0.75'
                    }
                }
            ],
            layout: {
                name: 'dagre',
                rankDir: 'LR',
                spacingFactor: 1.2,
                nodeSep: 60,
                rankSep: 150
            }
        });
    });
</script>
</body>
</html>
